<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZEROモデリング</title>
<!-- あかるい／くらい。色より先に当てる（画面がチカッとしないように）-->
<script src="/js/theme.js"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f172a'/%3E%3Cg fill='none' stroke='%233b82f6' stroke-width='2' stroke-linejoin='round'%3E%3Cpath d='M16 5l9 5v12l-9 5-9-5V10z'/%3E%3Cpath d='M7 10l9 5 9-5M16 15v12'/%3E%3C/g%3E%3C/svg%3E">

<link rel="stylesheet" href="/css/common.css">
<style>
  /* トップページだけ、スクロールできる1枚もの */
  body { overflow: auto; height: auto; min-height: 100dvh; display: block; }

  /* ══ ひょうし ══════════════════════════════════════════
     ★色は tokens.css から来た名前だけを使う。ぼかしの色も
       color-mix でアクセント色を薄めて作る（生の色を書かない）。 */
  .hero {
    position: relative;
    overflow: hidden;
    text-align: center;
    padding: 54px 20px 44px;
    border-bottom: 1px solid var(--line);
  }
  /* うしろのぼかし。まんなかの上あたりが ふわっと明るい */
  .hero::before {
    content: '';
    position: absolute; inset: -40% 0 auto; height: 300px;
    background: radial-gradient(60% 100% at 50% 100%,
      var(--accent-bg) 0%, transparent 70%);
    pointer-events: none;
  }
  /* うっすらした ほうがんし。3Dの作業台っぽさを出す */
  .hero::after {
    content: '';
    position: absolute; inset: 0;
    background:
      linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 100% 34px,
      linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 34px 100%;
    opacity: .22;
    mask-image: radial-gradient(70% 80% at 50% 40%, #000 0%, transparent 75%);
    pointer-events: none;
  }
  .hero > * { position: relative; }

  .hero h1 {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    font-size: clamp(27px, 6.4vw, 44px); font-weight: 900; letter-spacing: .01em;
  }
  .hero h1 svg { flex: none; width: clamp(30px, 7vw, 46px); height: auto; color: var(--accent2); }
  .hero .lead {
    color: var(--muted); font-size: clamp(13px, 3vw, 15.5px);
    margin-top: 14px; line-height: 1.9;
  }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 40px 18px 64px; }

  /* ══ つくるもの ════════════════════════════════════════
     ROOM-Maker の島と同じ組み立て。**まん中のものだけ大きく**、
     左右は小さくして のぞかせる。左右を押すと まん中に来る。
     ★3枚を同じマスに重ねて置き、transform でずらしている。
       こうすると 高さを数字で決めなくてよく、いちばん高いカードに
       自然にそろう（説明の長さが3枚でちがうため）。 */
  .deck { position: relative; overflow: hidden; padding: 14px 0 4px; }
  .deck-rail { display: grid; justify-items: center; }

  .deck-rail .card {
    grid-area: 1 / 1;                       /* 3枚とも同じマスへ重ねる */
    width: min(370px, 76vw);
    transition: transform .42s cubic-bezier(.22, .7, .25, 1), opacity .42s;
    will-change: transform;
  }
  .card[data-pos="0"]  { transform: translateX(0)    scale(1);   opacity: 1;   z-index: 3; }
  .card[data-pos="-1"] { transform: translateX(-97%) scale(.74); opacity: .52; z-index: 2; }
  .card[data-pos="1"]  { transform: translateX(97%)  scale(.74); opacity: .52; z-index: 2; }
  /* まん中でないカードは、押すと まん中に来るだけ（中の「作る」は働かない） */
  .card:not([data-pos="0"]) { cursor: pointer; }
  .card:not([data-pos="0"]) .go { opacity: .45; }

  /* 送りボタン */
  .deck-arrow {
    position: absolute; top: 50%; z-index: 5;
    width: 46px; height: 46px; border-radius: 50%;
    display: grid; place-items: center;
    border: 1px solid var(--line); background: var(--panel);
    color: var(--muted); font-size: 15px; cursor: pointer;
    transform: translateY(-50%);
  }
  .deck-arrow.prev { left: 4px; }
  .deck-arrow.next { right: 4px; }
  .deck-arrow:hover { color: var(--accent2); border-color: var(--accent2); }

  .deck-dots { display: flex; justify-content: center; gap: 10px; margin-top: 24px; }
  .deck-dots button {
    width: 10px; height: 10px; padding: 0; border: 0; border-radius: 50%;
    background: var(--line); cursor: pointer; transition: background .2s, transform .2s;
  }
  .deck-dots button[aria-current="true"] { background: var(--accent); transform: scale(1.4); }

  @media (max-width: 720px) {
    /* ★せまい画面では、まん中を細くして 左右をもっと見せる。
         のぞきが細いと「まだ他にもある」ことが伝わらない。 */
    .deck-rail .card { width: 70vw; }
    .card[data-pos="-1"] { transform: translateX(-84%) scale(.68); opacity: .45; }
    .card[data-pos="1"]  { transform: translateX(84%)  scale(.68); opacity: .45; }
    .deck-arrow { width: 38px; height: 38px; font-size: 13px; opacity: .92; }
    .deck-arrow.prev { left: 2px; }
    .deck-arrow.next { right: 2px; }
  }

  .card {
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
    overflow: hidden; text-decoration: none; color: var(--text);
    transition: border-color .18s, transform .18s, box-shadow .18s;
  }
  /* 絵のところ。カードの上半分をまるごと使う */
  .card .art {
    display: grid; place-items: center;
    padding: 34px 24px 26px;
    background:
      radial-gradient(80% 90% at 50% 20%,
        color-mix(in srgb, var(--accent-bg) 70%, transparent) 0%, transparent 70%),
      var(--panel2);
    border-bottom: 1px solid var(--line);
  }
  .card .art svg { width: 168px; height: 122px; }
  .card .body { display: flex; flex-direction: column; gap: 12px; padding: 24px 26px 26px; flex: 1; }
  .card .nm { font-size: 25px; font-weight: bold; letter-spacing: .01em; }
  .card .de { font-size: 15px; color: var(--muted); line-height: 1.9; flex: 1; }
  .card .tag {
    align-self: flex-start; font-size: 12.5px; font-weight: bold; color: var(--ok2);
    background: var(--ok-bg); border: 1px solid var(--ok); border-radius: 999px; padding: 5px 13px;
  }
  .card .go {
    display: inline-flex; align-items: center; gap: 6px; align-self: flex-start;
    margin-top: 5px; padding: 13px 24px; border-radius: 12px;
    background: var(--accent); color: #fff; font-size: 16px; font-weight: bold;
    transition: gap .18s;
  }
  /* ★浮かせる動きは まん中のカードだけ。全部にかけると、
       左右にずらす transform を打ち消してしまう（重なって見えた）。 */
  @media (hover: hover) and (pointer: fine) {
    .card[data-pos="0"]:hover {
      border-color: var(--accent2); transform: translateY(-5px) scale(1.015);
      box-shadow: 0 16px 34px color-mix(in srgb, var(--bg) 70%, transparent);
    }
    .card[data-pos="0"]:hover .go { gap: 11px; }
    .card:not([data-pos="0"]):hover { opacity: .78; }
  }
  .card[data-pos="0"]:active { transform: translateY(-1px); }

  /* 絵のなかの色づかい。3つとも同じ決まりでそろえる */
  .il-fill   { fill: var(--panel); }
  .il-line   { fill: none; stroke: var(--text); stroke-width: 2.2;
               stroke-linejoin: round; stroke-linecap: round; opacity: .85; }
  .il-accent { fill: var(--accent2); }
  .il-soft   { fill: var(--line); }

</style>
</head>

<!-- ひらがな切替（ヘッダー右上にボタンを足す） -->
<!-- 使いかた（右上の「？」）-->
<!-- ══ つくるものを、島のように送る ══════════════════════════
     まん中の1枚だけを大きく見せ、左右は小さくのぞかせる。
     ・左右のカードを押す … そのカードが まん中に来るだけ（先へは進まない）
     ・まん中のカードを押す … そのアプリへ行く
     ・◀ ▶ ／ 左右キー ／ 横になぞる でも送れる
     ★位置は data-pos（-1 / 0 / 1）で持ち、見た目はCSSが決める。 -->
<script>
(function () {
  'use strict';
  var deck = document.getElementById('deck');
  if (!deck) return;

  var cards = Array.prototype.slice.call(deck.querySelectorAll('.card'));
  var dots  = Array.prototype.slice.call(deck.querySelectorAll('.deck-dots button'));
  var n = cards.length;
  var at = 0;

  /* i 番のカードが、いま まん中から見て どこにいるか（-1 / 0 / 1） */
  function posOf(i) { return ((i - at + 1) % n + n) % n - 1; }

  function paint() {
    for (var i = 0; i < n; i++) {
      var p = posOf(i);
      cards[i].setAttribute('data-pos', String(p));
      /* まん中でないカードは タブで飛ばさない（押しても進まないため） */
      cards[i].setAttribute('tabindex', p === 0 ? '0' : '-1');
    }
    for (var k = 0; k < dots.length; k++)
      dots[k].setAttribute('aria-current', k === at ? 'true' : 'false');
  }
  function go(k) { at = ((k % n) + n) % n; paint(); }

  cards.forEach(function (c, i) {
    c.addEventListener('click', function (e) {
      if (posOf(i) === 0) return;      // まん中なら そのまま進む
      e.preventDefault();              // まん中でなければ、まず まん中に持ってくる
      go(i);
    });
  });
  dots.forEach(function (d, i) { d.onclick = function () { go(i); }; });
  deck.querySelector('.deck-arrow.prev').onclick = function () { go(at - 1); };
  deck.querySelector('.deck-arrow.next').onclick = function () { go(at + 1); };

  document.addEventListener('keydown', function (e) {
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (e.key === 'ArrowLeft')  { go(at - 1); e.preventDefault(); }
    if (e.key === 'ArrowRight') { go(at + 1); e.preventDefault(); }
  });

  /* 横になぞって送る。★たてに動かしたときは ページのスクロールを邪魔しない */
  var x0 = 0, y0 = 0, live = false;
  deck.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    x0 = e.clientX; y0 = e.clientY; live = true;
  });
  deck.addEventListener('pointerup', function (e) {
    if (!live) return;
    live = false;
    var dx = e.clientX - x0, dy = e.clientY - y0;
    if (Math.abs(dx) < 45 || Math.abs(dx) < Math.abs(dy)) return;
    go(dx < 0 ? at + 1 : at - 1);
  });
  deck.addEventListener('pointercancel', function () { live = false; });

  paint();
})();
</script>
