<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZEROモデリング</title>
<!-- あかるい／くらい。色より先に当てる（画面がチカッとしないように）-->
<script src="/js/theme.js"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f172a'/%3E%3Cg fill='none' stroke='%233b82f6' stroke-width='2' stroke-linejoin='round'%3E%3Cpath d='M16 5l9 5v12l-9 5-9-5V10z'/%3E%3Cpath d='M7 10l9 5 9-5M16 15v12'/%3E%3C/g%3E%3C/svg%3E">

<link rel="stylesheet" href="/css/common.css">
<style>
  /* トップページだけ、スクロールできる1枚もの */
  body { overflow: auto; height: auto; min-height: 100dvh; display: block; }

  /* ══ ひょうし ══════════════════════════════════════════
     ★色は tokens.css から来た名前だけを使う。ぼかしの色も
       color-mix でアクセント色を薄めて作る（生の色を書かない）。 */
  .hero {
    position: relative;
    overflow: hidden;
    text-align: center;
    padding: 54px 20px 44px;
    border-bottom: 1px solid var(--line);
  }
  /* うしろのぼかし。まんなかの上あたりが ふわっと明るい */
  .hero::before {
    content: '';
    position: absolute; inset: -40% 0 auto; height: 300px;
    background: radial-gradient(60% 100% at 50% 100%,
      var(--accent-bg) 0%, transparent 70%);
    pointer-events: none;
  }
  /* うっすらした ほうがんし。3Dの作業台っぽさを出す */
  .hero::after {
    content: '';
    position: absolute; inset: 0;
    background:
      linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 100% 34px,
      linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 34px 100%;
    opacity: .22;
    mask-image: radial-gradient(70% 80% at 50% 40%, #000 0%, transparent 75%);
    pointer-events: none;
  }
  .hero > * { position: relative; }

  .hero h1 {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    font-size: clamp(27px, 6.4vw, 44px); font-weight: 900; letter-spacing: .01em;
  }
  .hero h1 svg { flex: none; width: clamp(30px, 7vw, 46px); height: auto; color: var(--accent2); }
  .hero .lead {
    color: var(--muted); font-size: clamp(13px, 3vw, 15.5px);
    margin-top: 14px; line-height: 1.9;
  }

  .wrap { max-width: 1000px; margin: 0 auto; padding: 34px 16px 56px; }

  /* ══ つくるもの ════════════════════════════════════════ */
  .menu { display: grid; gap: 18px; grid-template-columns: 1fr; }
  @media (min-width: 780px) { .menu { grid-template-columns: repeat(3, 1fr); } }

  .card {
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
    overflow: hidden; text-decoration: none; color: var(--text);
    transition: border-color .18s, transform .18s, box-shadow .18s;
  }
  /* 絵のところ。カードの上半分をまるごと使う */
  .card .art {
    display: grid; place-items: center;
    padding: 26px 20px 20px;
    background:
      radial-gradient(80% 90% at 50% 20%,
        color-mix(in srgb, var(--accent-bg) 70%, transparent) 0%, transparent 70%),
      var(--panel2);
    border-bottom: 1px solid var(--line);
  }
  .card .art svg { width: 132px; height: 96px; }
  .card .body { display: flex; flex-direction: column; gap: 9px; padding: 18px 20px 20px; flex: 1; }
  .card .nm { font-size: 20px; font-weight: bold; letter-spacing: .01em; }
  .card .de { font-size: 13px; color: var(--muted); line-height: 1.8; flex: 1; }
  .card .tag {
    align-self: flex-start; font-size: 11px; font-weight: bold; color: var(--ok2);
    background: var(--ok-bg); border: 1px solid var(--ok); border-radius: 999px; padding: 4px 11px;
  }
  .card .go {
    display: inline-flex; align-items: center; gap: 6px; align-self: flex-start;
    margin-top: 3px; padding: 10px 18px; border-radius: 11px;
    background: var(--accent); color: #fff; font-size: 13.5px; font-weight: bold;
    transition: gap .18s;
  }
  @media (hover: hover) and (pointer: fine) {
    .card:hover {
      border-color: var(--accent2); transform: translateY(-4px);
      box-shadow: 0 14px 30px color-mix(in srgb, var(--bg) 70%, transparent);
    }
    .card:hover .go { gap: 11px; }
  }
  .card:active { transform: translateY(-1px); }

  /* 絵のなかの色づかい。3つとも同じ決まりでそろえる */
  .il-fill   { fill: var(--panel); }
  .il-line   { fill: none; stroke: var(--text); stroke-width: 2.2;
               stroke-linejoin: round; stroke-linecap: round; opacity: .85; }
  .il-accent { fill: var(--accent2); }
  .il-soft   { fill: var(--line); }

</style>
</head>
<body>

<div class="hero">
  <h1>
    <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3"
         stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
      <path d="M24 5l17 9.5v19L24 43 7 33.5v-19z"/>
      <path d="M7 14.5L24 24l17-9.5M24 24v19"/>
    </svg>
    ZEROモデリング
  </h1>
  <div class="lead">
    3Dプリンターで刷れるデータを、ブラウザだけで作れます。<br>
    インストールも、CADの知識も、ゼロから始められます。
  </div>
</div>

<div class="wrap">

  <div class="menu">

    <a class="card" href="nameplate.html">
      <span class="art">
        <svg viewBox="0 0 132 96" role="img" aria-label="なまえプレートの絵">
          <rect class="il-fill" x="16" y="22" width="100" height="60" rx="14"/>
          <rect class="il-line" x="16" y="22" width="100" height="60" rx="14"/>
          <circle class="il-line" cx="66" cy="16" r="7"/>
          <g class="il-accent">
            <rect x="34" y="44" width="10" height="18" rx="3"/>
            <rect x="50" y="38" width="10" height="24" rx="3"/>
            <rect x="66" y="46" width="10" height="16" rx="3"/>
            <rect x="82" y="40" width="10" height="22" rx="3"/>
          </g>
          <rect class="il-soft" x="34" y="68" width="58" height="4" rx="2"/>
        </svg>
      </span>
      <span class="body">
        <span class="nm">なまえプレート</span>
        <span class="de">好きな形の土台に名前をのせる。フォント・色・穴の場所も選べる。</span>
        <span class="tag">2色プリント対応</span>
        <span class="go">作る ▶</span>
      </span>
    </a>

    <a class="card" href="qr.html">
      <span class="art">
        <svg viewBox="0 0 132 96" role="img" aria-label="QRキーホルダーの絵">
          <rect class="il-fill" x="26" y="20" width="80" height="64" rx="13"/>
          <rect class="il-line" x="26" y="20" width="80" height="64" rx="13"/>
          <circle class="il-line" cx="66" cy="14" r="6.5"/>
          <g class="il-accent">
            <rect x="38" y="32" width="16" height="16" rx="3"/>
            <rect x="78" y="32" width="16" height="16" rx="3"/>
            <rect x="38" y="56" width="16" height="16" rx="3"/>
            <rect x="60" y="34" width="6" height="6"/><rect x="68" y="42" width="6" height="6"/>
            <rect x="60" y="50" width="6" height="6"/><rect x="70" y="58" width="6" height="6"/>
            <rect x="60" y="66" width="6" height="6"/><rect x="80" y="58" width="6" height="6"/>
            <rect x="88" y="66" width="6" height="6"/>
          </g>
          <g class="il-fill">
            <rect x="42" y="36" width="8" height="8" rx="1.5"/>
            <rect x="82" y="36" width="8" height="8" rx="1.5"/>
            <rect x="42" y="60" width="8" height="8" rx="1.5"/>
          </g>
        </svg>
      </span>
      <span class="body">
        <span class="nm">QRキーホルダー</span>
        <span class="de">URLを入れるとQRコードのキーホルダーになる。スマホで読みとれるか その場で試せる。</span>
        <span class="tag">読み取りチェック付き</span>
        <span class="go">作る ▶</span>
      </span>
    </a>

    <a class="card" href="clicker.html">
      <span class="art">
        <svg viewBox="0 0 132 96" role="img" aria-label="クリッカーメーカーの絵">
          <path class="il-fill" d="M40 30h52a10 10 0 0 1 10 10v6H30v-6a10 10 0 0 1 10-10z"/>
          <path class="il-line" d="M40 30h52a10 10 0 0 1 10 10v6H30v-6a10 10 0 0 1 10-10z"/>
          <rect class="il-fill" x="30" y="54" width="72" height="26" rx="9"/>
          <rect class="il-line" x="30" y="54" width="72" height="26" rx="9"/>
          <g class="il-accent">
            <rect x="62" y="60" width="8" height="14" rx="2"/>
            <rect x="58" y="64" width="16" height="6" rx="2"/>
          </g>
          <g class="il-line" opacity=".5">
            <path d="M66 14v9M52 18l4 7M80 18l-4 7"/>
          </g>
        </svg>
      </span>
      <span class="body">
        <span class="nm">クリッカーメーカー</span>
        <span class="de">3Dモデル（STL / 3MF / GLB）を入れると、キースイッチでカチカチ押せる上下2パーツにしてくれる。手もとに無ければ その場で作れる。</span>
        <span class="tag">Cherry MX互換</span>
        <span class="go">作る ▶</span>
      </span>
    </a>

  </div>

</div>

</body>
</html>
